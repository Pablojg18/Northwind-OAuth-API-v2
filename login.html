<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow" style="width: 100%; max-width: 420px;">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">Northwind</h3>

                <ul class="nav nav-tabs justify-content-center mb-4" id="tabAuth" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="tabLogin" data-bs-toggle="tab" data-bs-target="#paneLogin"
                            type="button" role="tab">Iniciar sesión</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tabRegistro" data-bs-toggle="tab" data-bs-target="#paneRegistro"
                            type="button" role="tab">Crear usuario</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="paneLogin" role="tabpanel">
                        <div id="googleButton" class="d-flex justify-content-center mb-3"></div>
                        <div id="googleNoConfig" class="alert alert-warning py-2 small d-none">
                            Configura <code>Authentication:Google:ClientId</code> en <code>appsettings.json</code>.
                        </div>
                        <div class="text-center text-muted small mb-3">— o usa tu correo —</div>

                        <form id="frmLogin" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="paneRegistro" role="tabpanel">
                        <form id="frmRegistro" novalidate>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="regPassword" minlength="6" required>
                                <div class="form-text">Mínimo 6 caracteres, una mayúscula, una minúscula, un número y un símbolo.</div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrarme</button>
                        </form>
                    </div>
                </div>

                <div id="mensaje" class="alert mt-3 d-none" role="alert"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const API_ORIGIN = location.port === '5500' ? 'https://localhost:7214' : '';
        const API_URL = API_ORIGIN + '/api/Auth';

        function mostrarMensaje(texto, tipo) {
            const el = document.getElementById('mensaje');
            el.className = 'alert alert-' + tipo + ' mt-3';
            el.textContent = texto;
            el.classList.remove('d-none');
        }

        function esperarGoogle() {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    return resolve();
                }
                let intentos = 0;
                const intervalo = setInterval(() => {
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        clearInterval(intervalo);
                        resolve();
                    } else if (++intentos > 100) {
                        clearInterval(intervalo);
                        reject(new Error('No se pudo cargar Google Sign-In'));
                    }
                }, 100);
            });
        }

        async function iniciarGoogle() {
            try {
                const response = await fetch(API_URL + '/google-config');
                const config = await response.json();

                if (!config.configured) {
                    document.getElementById('googleNoConfig').classList.remove('d-none');
                    return;
                }

                await esperarGoogle();
                google.accounts.id.initialize({
                    client_id: config.clientId,
                    callback: manejarCredencialGoogle
                });
                google.accounts.id.renderButton(document.getElementById('googleButton'), {
                    theme: 'outline',
                    size: 'large',
                    width: 360,
                    text: 'signin_with',
                    locale: 'es'
                });
            } catch (error) {
                console.error(error);
                mostrarMensaje(error.message, 'warning');
            }
        }

        function guardarSesion(data) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('usuario', JSON.stringify(data.user));
            window.location.href = 'dashboard.html';
        }

        async function manejarCredencialGoogle(respuesta) {
            try {
                const response = await fetch(API_URL + '/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: respuesta.credential })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'No se pudo iniciar sesión con Google');
                }

                guardarSesion(data);
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        }

        iniciarGoogle();

        document.getElementById('frmRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch(API_URL + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    const detalles = Array.isArray(data) ? data.map(d => d.description).join(' ') : data.message;
                    throw new Error(detalles || 'No se pudo crear el usuario');
                }

                mostrarMensaje(data.message, 'success');
                document.getElementById('frmRegistro').reset();
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        });

        document.getElementById('frmLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Credenciales inválidas');
                }

                guardarSesion(data);
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        });
    </script>
</body>

</html>
