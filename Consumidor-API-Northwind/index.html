<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumidor Northwind API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-box-seam"></i> Northwind API - Consumidor</a>
            <div class="d-flex align-items-center gap-2">
                <input id="apiUrl" class="form-control form-control-sm" style="width: 380px;" placeholder="https://xxxx.ngrok-free.app">
                <button id="btnGuardarUrl" class="btn btn-sm btn-outline-light">Guardar URL</button>
                <span id="userInfo" class="text-white-50 small d-none"></span>
                <button id="btnLoginGoogle" class="btn btn-sm btn-primary d-none"><i class="bi bi-google"></i> Login con Google</button>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger d-none">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="alertZone"></div>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">Conexion</div>
                    <div class="card-body">
                        <p class="small text-muted">Pega la URL que te de ngrok o la IP:puerto de quien ejecute la API.</p>
                        <div class="d-grid gap-2">
                            <button id="btnPing" class="btn btn-outline-primary"><i class="bi bi-wifi"></i> Comprobar conexion</button>
                            <a id="linkSwagger" href="#" target="_blank" class="btn btn-outline-secondary disabled"><i class="bi bi-file-earmark-text"></i> Abrir Swagger</a>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm mt-3">
                    <div class="card-header">Autenticacion</div>
                    <div class="card-body">
                        <p class="small text-muted">Usa OAuth con Google para obtener acceso.</p>
                        <div id="googleConfigInfo" class="small"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-table"></i> Productos</span>
                        <button id="btnCargar" class="btn btn-sm btn-primary" disabled><i class="bi bi-arrow-clockwise"></i> Cargar productos</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="tablaProductos">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Producto</th>
                                        <th>Proveedor</th>
                                        <th>Categoria</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <div id="sinDatos" class="text-center text-muted d-none">No hay datos o no has iniciado sesion.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/app.js"></script>
</body>
</html>
